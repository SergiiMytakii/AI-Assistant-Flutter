<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
        <h1 style="color: #333; text-align: center;">Email Confirmation</h1>
        <p>Hello {name}!</p>
        <p>Thank you for registering. Your confirmation code is: <h2 style="display: inline; color: blue;">{confirmation_code}</h2></p>
        <p>Please use this code to complete the registration process.</p>
        <p>If you did not register, please disregard this email.</p>
        <p style="text-align: center; margin-top: 20px;">Best regards,<br>AI Assistant</p>
    </div>
</body>
</html>
